name: Build Extensions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run validate:packages
      - run: npm run package:archives -- "${GITHUB_REF_NAME}"
      - run: npm run package:amo-source -- "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-chrome-${{ github.ref_name }}
          path: dist/commit-arcade-chrome-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-firefox-${{ github.ref_name }}
          path: dist/commit-arcade-firefox-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-firefox-source-${{ github.ref_name }}
          path: dist/commit-arcade-firefox-source-${{ github.ref_name }}.zip
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Commit Arcade ${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Commit Arcade ${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md
          fi
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/commit-arcade-chrome-${GITHUB_REF_NAME}.zip" \
            "dist/commit-arcade-firefox-${GITHUB_REF_NAME}.zip" \
            "dist/commit-arcade-firefox-source-${GITHUB_REF_NAME}.zip" \
            --clobber
