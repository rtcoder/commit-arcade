name: Build Extensions

on:
  push:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: package-version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: package-suffix
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run validate:packages
      - run: npm run package:archives -- "${PACKAGE_VERSION}"
        env:
          PACKAGE_VERSION: ${{ steps.package-suffix.outputs.value }}
      - run: npm run package:amo-source -- "${PACKAGE_VERSION}"
        env:
          PACKAGE_VERSION: ${{ steps.package-suffix.outputs.value }}
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-chrome-${{ steps.package-suffix.outputs.value }}
          path: dist/commit-arcade-chrome-${{ steps.package-suffix.outputs.value }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-firefox-${{ steps.package-suffix.outputs.value }}
          path: dist/commit-arcade-firefox-${{ steps.package-suffix.outputs.value }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: commit-arcade-firefox-source-${{ steps.package-suffix.outputs.value }}
          path: dist/commit-arcade-firefox-source-${{ steps.package-suffix.outputs.value }}.zip
